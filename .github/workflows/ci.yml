name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server and booking rules
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Web app
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          npm run build:server
